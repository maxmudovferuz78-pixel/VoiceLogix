<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Logistika Tarjimon — MVP</title>
<style>
  :root {
    --bg: #12161d; --surface: #1b212b; --border: #2a313d;
    --text: #e9e7df; --text-muted: #8b93a3; --accent: #e8a33d; --accent-2: #5fa8d3;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
    display: flex; justify-content: center; padding: 40px 16px;
  }
  .card {
    width: 100%; max-width: 640px; background: var(--surface);
    border: 1px solid var(--border); border-radius: 14px; padding: 32px;
  }
  h1 { font-size: 22px; margin: 0 0 6px; }
  .subtitle { color: var(--text-muted); font-size: 14px; margin: 0 0 28px; }
  .direction-toggle {
    display: flex; gap: 8px; margin-bottom: 16px; background: var(--bg);
    border: 1px solid var(--border); border-radius: 10px; padding: 4px;
  }
  .direction-toggle label {
    flex: 1; text-align: center; padding: 10px; border-radius: 8px;
    cursor: pointer; font-size: 14px; color: var(--text-muted); transition: 0.15s;
  }
  .direction-toggle input { display: none; }
  .direction-toggle input:checked + span { color: var(--bg); }
  .direction-toggle label:has(input:checked) { background: var(--accent-2); }
  .direction-toggle label:has(input:checked) span { color: #0d1117; font-weight: 600; }
  textarea {
    width: 100%; min-height: 120px; background: var(--bg); border: 1px solid var(--border);
    border-radius: 10px; padding: 14px; color: var(--text); font-size: 15px;
    font-family: inherit; resize: vertical;
  }
  textarea:focus { outline: none; border-color: var(--accent-2); }
  button {
    margin-top: 14px; width: 100%; padding: 13px; border: none; border-radius: 10px;
    background: var(--accent); color: #1a1305; font-size: 15px; font-weight: 600;
    cursor: pointer;
  }
  button:hover { opacity: 0.9; }
  .result {
    margin-top: 24px; padding: 18px; background: var(--bg); border: 1px solid var(--border);
    border-radius: 10px; white-space: pre-wrap; line-height: 1.6;
  }
  .result-label {
    font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--accent-2); margin-bottom: 8px; display: block;
  }
  .footer-note { margin-top: 20px; font-size: 12.5px; color: var(--text-muted); text-align: center; }
</style>
</head>
<body>
<div class="card">
  <h1>🚚 Logistika Tarjimon</h1>
  <p class="subtitle">O'zbekcha &harr; Inglizcha — logistika atamalari bilan (MVP versiya)</p>

  <form method="post">
    {% csrf_token %}
    <div class="direction-toggle">
      <label>
        <input type="radio" name="direction" value="uz_to_en" {% if direction == "uz_to_en" %}checked{% endif %}>
        <span>O'zbekcha &rarr; Inglizcha</span>
      </label>
      <label>
        <input type="radio" name="direction" value="en_to_uz" {% if direction == "en_to_uz" %}checked{% endif %}>
        <span>Inglizcha &rarr; O'zbekcha</span>
      </label>
    </div>

    <textarea name="text" placeholder="Matnni shu yerga yozing...">{{ original_text }}</textarea>
    <button type="submit">Tarjima qilish</button>
  </form>

  {% if result %}
  <div class="result">
    <span class="result-label">Natija</span>
    {{ result.translated_text }}
  </div>
  {% endif %}

  <p class="footer-note">MVP versiya &mdash; bepul Google Tarjimon + logistika lug'ati asosida ishlaydi</p>
</div>
</body>
</html>
